# Books shown on /books/. One entry per book; `id` becomes the page address /books/<id>/.
# A new book: publish its site on <subdomain>.begtin.tech, then add an entry here.
# Every text field has both `en` and `ru`: the English page describes Russian books too.

- id: data-catalogs
  order: 1
  title:
    en: Data Catalogs
    ru: Каталоги данных
  subtitle:
    en: How open data portals, geoportals and repositories work, and how to choose your own
    ru: Как устроены порталы открытых данных, геопорталы и репозитории — и как выбрать свой
  summary:
    en: >-
      A book about public data catalogs: open data portals, geoportals, research repositories,
      statistics catalogs and machine learning dataset hubs. It explains what kinds of catalogs
      exist and what they can do, how to choose features and a platform and justify the choice,
      and how to publish data, with or without a portal. The numbers in the book come from an
      open registry of more than 43,000 catalogs.
    ru: >-
      Книга о публичных каталогах данных: порталах открытых данных, геопорталах, научных
      репозиториях, каталогах статистики и наборов для машинного обучения. Она объясняет, какие
      каталоги бывают и что они умеют, как выбрать функции и платформу и обосновать выбор, как
      публиковать данные — на портале или без него. Цифры книги посчитаны по открытому реестру
      более чем 43 тысяч каталогов.
  language: ru
  year: 2026
  edition:
    en: October 2026
    ru: октябрь 2026
  status: published
  cover: /img/books/data-catalogs.webp
  site: https://datacatalogs.begtin.tech/
  repo: https://github.com/ivbeg/data-catalogs-book
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  files:
    - format: PDF
      url: https://datacatalogs.begtin.tech/data-catalogs-book.pdf
  parts:
    - {en: What a data catalog is, ru: Что такое каталог данных}
    - {en: What data gets published, ru: Какие данные публикуют}
    - {en: Types of catalogs, ru: Типы каталогов}
    - {en: Catalog capabilities, ru: Возможности каталогов}
    - {en: Platforms and extensions, ru: Платформы и расширения}
    - {en: How to choose a catalog, ru: Как выбрать каталог}
    - {en: How data is published, ru: Как публикуют данные}
    - {en: Publishing without a portal, ru: Публикация без портала}
    - {en: Practices, ru: Практики}
    - {en: Catalog quality, ru: Качество каталогов}
    - {en: Trends, ru: Тренды}
    - {en: Appendices, ru: Приложения}

- id: government-finance
  order: 2
  title:
    en: Government Finance Knowledge Base
    ru: База знаний по государственным финансам
  subtitle:
    en: How government finance works in Russia and how to work with open finance data
    ru: Как устроены государственные финансы в России и как работать с открытыми финансовыми данными
  summary:
    en: >-
      A reference book in plain language: what data the state accumulates about budgets,
      spending and procurement, how these data are linked and how to work with them. Glossary,
      organizations, information systems, data sources and how-to guides.
    ru: >-
      Справочник простым языком: какие данные накапливает государство о бюджетах, расходах и
      закупках, как эти данные связаны и как с ними работать. Глоссарий, организации,
      информационные системы, источники данных и практические инструкции.
  language: ru
  year: 2026
  status: in-progress
  publisher:
    en: Infoculture
    ru: Инфокультура
  site: https://infoculture.github.io/finguide/
  repo: https://github.com/infoculture/finguide

- id: government-ngos
  order: 3
  title:
    en: Government NGOs and Their Openness
    ru: Государственные НКО и их открытость
  subtitle:
    en: Non-profits founded by the state in Russia and how transparent they are
    ru: Некоммерческие организации, учреждённые государством, и насколько они открыты
  summary:
    en: >-
      The state spends more than 500 billion rubles a year on non-profits, and most of it goes to
      organizations founded by government bodies. They replace budget institutions but fall
      outside the rules on procurement, civil service, anti-corruption and disclosure. The book
      classifies government NGOs, estimates their number, compares their openness with other
      non-profits and budget institutions, traces their funding and proposes how to make them
      accountable.
    ru: >-
      Государство тратит на некоммерческие организации более 500 миллиардов рублей в год, и
      большая часть этих денег идёт организациям, которые учредили органы власти. Они создаются
      взамен бюджетных учреждений, но выведены из-под правил о закупках, госслужбе,
      противодействии коррупции и раскрытии информации. Книга классифицирует государственные НКО,
      оценивает их число, сравнивает их открытость с другими НКО и бюджетными учреждениями,
      разбирает финансирование и предлагает, как сделать их подотчётными.
  language: ru
  year: 2022
  status: published
  site: https://ivbeg.github.io/book-govngo/
  repo: https://github.com/ivbeg/book-govngo
  parts:
    - {en: Classification of government NGOs, ru: Классификация государственных НКО}
    - {en: Regulation, ru: Особенности регулирования}
    - {en: How many there are, ru: Оценки численности}
    - {en: Openness, ru: Открытость}
    - {en: Funding, ru: Финансирование}
    - {en: Conclusion and limitations, ru: Заключение и ограничения}
    - {en: Appendices, ru: Приложения}
