# Books shown on /books/. One entry per book; `id` becomes the page address /books/<id>/.
# A new book: publish its site on <subdomain>.begtin.tech, then add an entry here.
# Every text field has both `en` and `ru`. `languages` lists the editions of the book itself
# (original first); `site` and each file are given per edition language.

- id: data-inventory
  order: 1
  title:
    en: Data Inventory
    ru: Инвентаризация данных
  subtitle:
    en: How to find out what data you have and find the data you are missing
    ru: Как выяснить, какие данные у вас есть, и найти те, которых не хватает
  summary:
    en: >-
      A book about data inventory: finding and describing data, that is, which datasets exist,
      where they are kept, who owns them, on what grounds they are collected, whether they are
      accessible and how good they are. It follows two approaches: taking stock of an
      organization's own data and finding the data a task needs, including data held by others.
      It covers the seven steps from a goal to a maintained data registry, where to look for
      government, public and commercial data, description standards, tools and the practice of
      twelve countries, with templates and checklists.
    ru: >-
      Книга об инвентаризации данных — выявлении и описании данных: какие наборы есть, где они
      хранятся, кто ими владеет, на каком основании их собирают, доступны ли они и какого
      качества. В ней два подхода: опись собственных данных организации и поиск данных под
      задачу, в том числе у других. Книга проходит семь шагов от цели до реестра данных, который
      поддерживают, рассказывает, где искать государственные, общественные и коммерческие данные,
      о стандартах описания, инструментах и практике двенадцати стран, и даёт шаблоны и
      чек-листы.
  languages: [ru]
  year: 2026
  edition:
    en: October 2026 draft
    ru: черновик, октябрь 2026
  status: in-progress
  cover: /img/books/data-inventory.webp
  site:
    ru: https://datainventory.begtin.tech/
  repo: https://github.com/ivbeg/data-inventory
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  files:
    - format: PDF
      lang: ru
      url: https://datainventory.begtin.tech/data-inventory-book.pdf
  parts:
    - {en: What data inventory is, ru: Что такое инвентаризация данных}
    - {en: Approaches and methods, ru: Подходы и методы}
    - {en: How to run an inventory, ru: Как провести инвентаризацию}
    - {en: Where to look for data, ru: Где искать данные}
    - {en: Standards and international experience, ru: Стандарты и зарубежный опыт}
    - {en: Tools, ru: Инструменты}
    - {en: Country practices, ru: Страновые практики}
    - {en: Practices, ru: Практики}
    - {en: Appendices, ru: Приложения}

- id: data-catalogs
  order: 2
  title:
    en: Data Catalogs
    ru: Каталоги данных
  subtitle:
    en: How open data portals, geoportals and repositories work, and how to choose your own
    ru: Как устроены порталы открытых данных, геопорталы и репозитории — и как выбрать свой
  summary:
    en: >-
      A book about public data catalogs: open data portals, geoportals, research repositories,
      statistics catalogs and machine learning dataset hubs. It explains what kinds of catalogs
      exist and what they can do, how to choose features and a platform and justify the choice,
      and how to publish data, with or without a portal. The numbers in the book come from an
      open registry of more than 43,000 catalogs.
    ru: >-
      Книга о публичных каталогах данных: порталах открытых данных, геопорталах, научных
      репозиториях, каталогах статистики и наборов для машинного обучения. Она объясняет, какие
      каталоги бывают и что они умеют, как выбрать функции и платформу и обосновать выбор, как
      публиковать данные — на портале или без него. Цифры книги посчитаны по открытому реестру
      более чем 43 тысяч каталогов.
  languages: [ru, en]
  year: 2026
  edition:
    en: October 2026
    ru: октябрь 2026
  status: published
  cover: /img/books/data-catalogs.webp
  site:
    ru: https://datacatalogs.begtin.tech/
    en: https://datacatalogs.begtin.tech/en/
  repo: https://github.com/ivbeg/data-catalogs-book
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
  files:
    - format: PDF
      lang: ru
      url: https://datacatalogs.begtin.tech/data-catalogs-book.pdf
    - format: PDF
      lang: en
      url: https://datacatalogs.begtin.tech/data-catalogs-book-en.pdf
  parts:
    - {en: What a data catalog is, ru: Что такое каталог данных}
    - {en: What data gets published, ru: Какие данные публикуют}
    - {en: Types of catalogs, ru: Типы каталогов}
    - {en: Catalog capabilities, ru: Возможности каталогов}
    - {en: Platforms and extensions, ru: Платформы и расширения}
    - {en: How to choose a catalog, ru: Как выбрать каталог}
    - {en: How data is published, ru: Как публикуют данные}
    - {en: Publishing without a portal, ru: Публикация без портала}
    - {en: Practices, ru: Практики}
    - {en: Catalog quality, ru: Качество каталогов}
    - {en: Trends, ru: Тренды}
    - {en: Appendices, ru: Приложения}
