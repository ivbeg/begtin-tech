# --- Digital preservation ---

- id: ruarxive
  group: preservation
  order: 1
  name: {en: National Digital Archive, ru: Национальный цифровой архив}
  years: 2017–
  url: https://ruarxive.org/
  repo: https://github.com/ruarxive
  summary:
    en: >-
      Saves websites, Telegram channels and open data at risk of disappearing, mostly
      government ones, and makes the archives open. Archived open data portals in 2022 and the
      Rosstat and EMISS statistics sites in 2025.
    ru: >-
      Сохраняет сайты, Telegram-каналы и открытые данные, которым грозит исчезновение, прежде
      всего государственные, и делает архивы открытыми. В 2022 году архивировал порталы открытых
      данных, в 2025 году — сайты Росстата и систему ЕМИСС.

- id: apibackuper
  group: preservation
  order: 2
  name: {en: apibackuper, ru: apibackuper}
  repo: https://github.com/ruarxive/apibackuper
  summary:
    en: Backs up data that is only available page by page through an API.
    ru: Сохраняет данные, которые отдаются только постранично через API.

# --- Open-source tools ---

- id: undatum
  group: tools
  order: 1
  name: {en: undatum, ru: undatum}
  repo: https://github.com/datenoio/undatum
  summary:
    en: A command-line tool for data files in CSV, NDJSON, XML and other formats.
    ru: 'Обработка файлов данных из командной строки: CSV, NDJSON, XML и другие форматы.'

- id: metacrafter
  group: tools
  order: 2
  name: {en: metacrafter, ru: metacrafter}
  repo: https://github.com/apicrafter/metacrafter
  summary:
    en: Detects what table columns contain, such as identifiers, codes and personal data.
    ru: 'Определяет, что лежит в колонках таблицы: идентификаторы, коды, персональные данные.'

- id: filerepack
  group: tools
  order: 3
  name: {en: filerepack, ru: filerepack}
  url: https://ivbeg.github.io/filerepack/
  repo: https://github.com/ivbeg/filerepack
  summary:
    en: Lossless-first recompression of Office documents, archives, images, PDFs and data files.
    ru: Пересжатие документов Office, архивов, изображений, PDF и файлов данных, по возможности без потерь.

- id: newsworker
  group: tools
  order: 4
  name: {en: newsworker, ru: newsworker}
  repo: https://github.com/ivbeg/newsworker
  summary:
    en: Finds and extracts news feeds from websites that have no RSS or Atom.
    ru: Находит и извлекает ленты новостей с сайтов, у которых нет RSS или Atom.

- id: qddate
  group: tools
  order: 5
  name: {en: qddate, ru: qddate}
  repo: https://github.com/ivbeg/qddate
  summary:
    en: A Python library that parses dates from HTML very fast.
    ru: Библиотека на Python для очень быстрого разбора дат в HTML.

- id: docx2csv
  group: tools
  order: 6
  name: {en: docx2csv, ru: docx2csv}
  repo: https://github.com/ivbeg/docx2csv
  summary:
    en: Extracts tables from .docx files and saves them as CSV or XLS.
    ru: Извлекает таблицы из файлов .docx и сохраняет их в CSV или XLS.

- id: readability
  group: tools
  order: 7
  name: {en: Readability for Russian, ru: Понятный русский язык}
  years: 2014
  repo: https://github.com/ivbeg/readability.io
  summary:
    en: Readability formulas adapted to Russian, used to check how plain official texts are.
    ru: Формулы удобочитаемости, адаптированные к русскому языку, — для проверки понятности официальных текстов.

- id: awesome-status-pages
  group: tools
  order: 8
  name: {en: awesome-status-pages, ru: awesome-status-pages}
  repo: https://github.com/ivbeg/awesome-status-pages
  summary:
    en: A curated list of open-source status page software, services and public status pages.
    ru: Подборка программ и сервисов для страниц статуса и публичных страниц статуса крупных компаний.
