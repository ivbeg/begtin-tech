# Projects shown on /projects/, grouped by `group`, sorted by `order` inside a group.
# Groups: discovery, organizations, government, preservation, tools (titles in src/i18n).
# Numbers in summaries carry a date: they change, the date tells the reader how old they are.

# --- Data discovery ---

- id: dateno
  group: discovery
  order: 1
  name: {en: Dateno, ru: Dateno}
  role: {en: Founder and CTO, ru: Основатель и технический директор}
  years: 2024–
  url: https://dateno.io/
  repo: https://github.com/datenoio
  summary:
    en: >-
      A search engine for datasets. It learns each catalog's platform and API addresses from the
      registry of data catalogs and collects dataset descriptions through them: 22 million
      datasets from 5,236 sources as of October 2026.
    ru: >-
      Поисковик по наборам данных. Он узнаёт из реестра каталогов платформу каталога и адреса его
      API и по ним собирает описания наборов: 22 миллиона наборов из 5 236 источников на октябрь
      2026 года.

- id: dataportals-registry
  group: discovery
  order: 2
  name: {en: Registry of data catalogs, ru: Реестр каталогов данных}
  role: {en: Creator and maintainer, ru: Автор и ведущий}
  years: 2023–
  url: https://datenoio.github.io/dataportals-registry/
  repo: https://github.com/datenoio/dataportals-registry
  summary:
    en: >-
      An open registry of data catalogs of the whole world, started as Common Data Index:
      43,614 catalogs and 790 platforms in release 1.27.0 of October 2026.
    ru: >-
      Открытый реестр каталогов данных всего мира, начатый как Common Data Index: 43 614 каталогов
      и 790 платформ в выпуске 1.27.0 от октября 2026 года.

- id: datacatalogs-ru
  group: discovery
  order: 3
  name: {en: datacatalogs.ru, ru: datacatalogs.ru}
  years: 2021–
  url: https://datacatalogs.ru/
  summary:
    en: A list of data catalogs of Russia by Infoculture. It had 245 entries at launch in November 2021.
    ru: Перечень каталогов данных России от Инфокультуры. При запуске в ноябре 2021 года в нём было 245 записей.

# --- Organizations ---

- id: infoculture
  group: organizations
  order: 1
  name: {en: Infoculture, ru: Инфокультура}
  role: {en: Founder and director, ru: Основатель и директор}
  years: 2012–
  url: https://infoculture.ru/
  repo: https://github.com/infoculture
  summary:
    en: >-
      Informational Culture, a non-profit for open government and open data. Founded in March 2012
      by the founders of the Apps4Russia contest. Runs open databases, the National Digital
      Archive and Open Data Day in Moscow.
    ru: >-
      АНО «Информационная культура» — некоммерческая организация, которая занимается открытостью
      государства и открытыми данными. Создана в марте 2012 года основателями конкурса
      Apps4Russia. Ведёт открытые базы данных, Национальный цифровой архив и День открытых данных
      в Москве.

- id: opendata-am
  group: organizations
  order: 2
  name: {en: Open Data Armenia, ru: Открытые данные Армении}
  role: {en: Co-founder and project leader, ru: Сооснователь и руководитель проекта}
  years: 2023–
  url: https://opendata.am/
  summary:
    en: >-
      A community initiative that collects and publishes open data about Armenia and promotes
      open data in Armenia and in the global Armenian community.
    ru: >-
      Общественная инициатива, которая собирает и публикует открытые данные об Армении и
      продвигает открытые данные в Армении и в армянском сообществе по всему миру.

- id: apicrafter
  group: organizations
  order: 3
  name: {en: APICrafter, ru: APICrafter}
  role: {en: Founder and CEO, ru: Основатель и генеральный директор}
  years: 2018–
  url: https://apicrafter.ru/
  repo: https://github.com/apicrafter
  summary:
    en: >-
      A data technology company focused on open-source software: data APIs and tools for
      understanding data, including metacrafter, which detects what table columns contain.
    ru: >-
      Компания по технологиям работы с данными с упором на открытый код: API к данным и
      инструменты для их разбора, в том числе metacrafter, который определяет, что лежит в
      колонках таблиц.

# --- Open government and public spending ---

- id: spending-gov
  group: government
  order: 1
  name: {en: Public spending portal, ru: Портал «Госрасходы»}
  role:
    en: Head of the Open Data team, Accounts Chamber of Russia
    ru: Руководитель команды «Открытые данные» Счётной палаты России
  years: 2019–2021
  summary:
    en: >-
      spending.gov.ru: contracts, subsidies and national project spending, released as open data
      and through an API. A team of six built it in four and a half months; it launched in
      November 2019.
    ru: >-
      spending.gov.ru: контракты, субсидии и расходы на национальные проекты, открытыми данными и
      через API. Команда из шести человек сделала портал за четыре с половиной месяца, его
      запустили в ноябре 2019 года.

